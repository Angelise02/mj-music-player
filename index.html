<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover để env(safe-area-inset-*) hoạt động trên máy có notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0B12" />
    <title>Music Player</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <!--
      Gắn ?v= cho CSS/JS: GitHub Pages cache file tĩnh (Cache-Control: max-age=600).
      Không có query này thì sửa code xong người dùng vẫn thấy bản cũ.
      Nhớ TĂNG số mỗi lần sửa style.css / main.js.
    -->
    <link rel="stylesheet" href="style.css?v=5" />
  </head>

  <body>
    <div class="player" id="player">
      <!-- ============ DASHBOARD ============ -->
      <div class="dashboard">
        <header>
          <h4>ĐANG PHÁT</h4>
          <h2 id="nowPlaying">—</h2>
          <p class="now-artist" id="nowArtist"></p>
        </header>

        <div class="cd" id="cd">
          <div class="cd-thumb" id="cdThumb"></div>
        </div>

        <p class="error-msg" id="errorMsg" hidden></p>

        <div class="control">
          <button class="btn btn-repeat" id="repeatBtn" aria-label="Lặp">
            <i class="fas fa-redo"></i>
            <span class="badge" id="repeatBadge" hidden>1</span>
          </button>
          <button class="btn btn-prev" id="prevBtn" aria-label="Bài trước">
            <i class="fas fa-step-backward"></i>
          </button>
          <button class="btn btn-toggle-play" id="playBtn" aria-label="Phát hoặc dừng">
            <i class="fas fa-pause icon-pause"></i>
            <i class="fas fa-play icon-play"></i>
          </button>
          <button class="btn btn-next" id="nextBtn" aria-label="Bài sau">
            <i class="fas fa-step-forward"></i>
          </button>
          <button class="btn btn-random" id="randomBtn" aria-label="Ngẫu nhiên">
            <i class="fas fa-random"></i>
          </button>
        </div>

        <div class="progress-div">
          <div class="time time-start" id="timeStart">0:00</div>
          <input
            id="progress"
            class="progress"
            type="range"
            value="0"
            step="0.1"
            min="0"
            max="100"
            aria-label="Tiến trình"
          />
          <div class="time time-end" id="timeEnd">0:00</div>
        </div>

        <div class="volume-div">
          <button class="btn btn-mute" id="muteBtn" aria-label="Tắt tiếng">
            <i class="fas fa-volume-up" id="volIcon"></i>
          </button>
          <input
            id="volume"
            class="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            aria-label="Âm lượng"
          />
        </div>

        <!-- Nạp nhạc thật từ máy -->
        <div class="load-row">
          <input
            type="file"
            id="fileInput"
            accept="audio/*"
            multiple
            hidden
          />
          <button class="btn-load" id="btnLoad">
            <i class="fas fa-folder-open"></i>
            <span>Nạp nhạc từ máy</span>
          </button>
          <button class="btn-load btn-ghost" id="btnDemo">
            <i class="fas fa-music"></i>
            <span>Về 27 bài MJ</span>
          </button>
        </div>

        <p class="hint">
          <kbd>Space</kbd> phát/dừng · <kbd>←</kbd><kbd>→</kbd> chuyển bài ·
          <kbd>↑</kbd><kbd>↓</kbd> âm lượng · <kbd>M</kbd> tắt tiếng · <kbd>S</kbd> ngẫu nhiên · <kbd>R</kbd> lặp
        </p>
      </div>

      <!-- ============ PLAYLIST ============ -->
      <div class="playlist" id="playlist"></div>
    </div>

    <audio id="audio" preload="metadata" playsinline></audio>

    <script src="main.js?v=5"></script>
  </body>
</html>
